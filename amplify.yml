version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        # Run DB migrations (uses DATABASE_URL from Amplify env vars)
    build:
      commands:
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production
        - echo "AUTH_TRUST_HOST=true" >> .env.production
        - echo "EMAIL_SERVER_HOST=$EMAIL_SERVER_HOST" >> .env.production
        - echo "EMAIL_SERVER_PORT=$EMAIL_SERVER_PORT" >> .env.production
        - echo "EMAIL_SERVER_SECURE=$EMAIL_SERVER_SECURE" >> .env.production
        - echo "EMAIL_FROM=$EMAIL_FROM" >> .env.production
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

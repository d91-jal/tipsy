version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        # Run DB migrations (uses DATABASE_URL from Amplify env vars)
        - npx prisma migrate deploy
    build:
      commands:
        #- npm run build
        - npx next build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
